<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090d18" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="류현상 키우기" />
  <meta name="description" content="무명 버스커 류현상을 월드 스타로 키우는 반응형 웹게임" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="style.css?v=78-balance-system" />
  <title>류현상 키우기 v78</title>
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>
  <main id="app">
    <section id="titleScreen" class="screen title-screen active">
      <div class="title-card">
        <p class="eyebrow">WEBTOON MUSIC SIMULATION</p>
        <h1>류현상 키우기</h1>
        <p class="subtitle">거리의 무명가수에서 월드 스타까지</p>
        <div class="title-actions">
          <button id="newGameBtn" class="primary">새 게임</button>
          <button id="continueBtn">이어하기</button>
          <button id="howBtn">게임 설명</button>
        </div>
        <button id="installBtn" class="install hidden">📲 앱으로 설치</button>
        <p id="installHint" class="install-hint hidden">홈 화면에 설치하면 앱처럼 전체화면으로 실행됩니다.</p>
      </div>
    </section>

    <section id="gameScreen" class="screen game-screen">
      <header class="topbar">
        <div class="brand">류현상 키우기</div>
        <div class="timebox"><strong id="dayText">1일차</strong><span id="timeText">오전</span></div>
        <div id="topStats" class="top-stats"></div>
        <div class="top-controls"><button id="audioBtn" class="icon-btn" aria-label="음악 설정" title="음악 설정">♪</button><button id="menuBtn" class="icon-btn" aria-label="메뉴">☰</button></div>
      </header>

      <section class="mobile-map" aria-label="장소 이동">
        <div class="mobile-map-head">
          <strong>지도 이동</strong>
          <span id="mobileLocationText">현재: 자취방</span>
        </div>
        <div id="mobileLocationButtons" class="mobile-location-buttons"></div>
      </section>

      <section id="mobileResources" class="mobile-resources" aria-label="보유 자원"></section>

      <section class="mobile-phone" aria-label="휴대전화 메뉴">
        <div class="mobile-phone-head"><strong>휴대전화</strong><span>메뉴를 좌우로 넘겨 보세요</span></div>
        <div class="mobile-phone-grid">
          <button data-phone="manager">후라보노</button>
          <button data-phone="band">밴드</button>
          <button data-phone="fan">팬</button>
          <button data-phone="sns">SNS</button>
          <button data-phone="items">아이템</button>
        </div>
      </section>

      <div class="game-layout">
        <aside class="left-panel panel">
          <div class="profile-row">
            <div class="level"><small>인지도 Lv.</small><strong id="levelText">1</strong></div>
            <div><strong>류현상</strong><small id="rankText">무명 가수</small></div>
          </div>
          <div id="resourceStats" class="resource-list"></div>
          <div class="panel-section">
            <h3>오늘의 일정</h3>
            <ul id="scheduleList"></ul>
          </div>
          <div class="panel-section">
            <h3>진행 중 목표</h3>
            <div id="missionBox"></div>
          </div>
        </aside>

        <section id="scene" class="scene home">
          <div class="scene-overlay"></div>
          <div id="ambientLayer" class="ambient-layer" aria-hidden="true"></div>
          <div id="musicNotes" class="music-notes" aria-hidden="true"></div>
          <div id="audienceLights" class="audience-lights" aria-hidden="true"></div>
          <div class="character-shadow" aria-hidden="true"></div>
          <div class="location-label" id="locationLabel">자취방</div>
          <div class="character-wrap" id="characterWrap">
            <img id="characterArt" class="character-art" src="assets/images/ryu.png" alt="류현상" />
          </div>
          <div id="actionBurst" class="action-burst" aria-hidden="true"></div>
          <div id="eventBadge" class="event-badge hidden">돌발 사건</div>

          <div class="dialogue-wrap">
            <div class="nameplate" id="speakerName">류현상</div>
            <div class="dialogue-box">
              <p id="dialogueText">오늘도 한 곡이라도 더 완성해 보자.</p>
              <div id="choiceArea" class="choices hidden"></div>
            </div>
          </div>
        </section>

        <aside class="right-panel panel">
          <div class="panel-section">
            <h3>어디로 이동할까?</h3>
            <div id="locationButtons" class="location-buttons"></div>
          </div>
          <div class="panel-section phone">
            <h3>휴대전화</h3>
            <div class="phone-grid">
              <button data-phone="manager">후라보노</button>
              <button data-phone="band">밴드</button>
              <button data-phone="fan">팬</button>
              <button data-phone="sns">SNS</button>
              <button data-phone="items">아이템</button>
            </div>
          </div>
        </aside>
      </div>

      <section class="actions-panel">
        <h2>무엇을 할까?</h2>
        <div id="actionButtons" class="action-grid"></div>
      </section>

      <nav class="bottom-nav">
        <button data-tab="main" class="active">메인</button>
        <button data-tab="story">스토리</button>
        <button data-tab="band">멤버</button>
        <button data-tab="album">추억 앨범</button>
        <button data-tab="shop">상점</button>
        <button data-tab="ending">엔딩</button>
      </nav>
    </section>
  </main>

  <dialog id="modal">
    <div class="modal-head"><h2 id="modalTitle">알림</h2><button id="closeModal">×</button></div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalToast" class="toast modal-toast" aria-live="assertive" aria-atomic="true"></div>
  </dialog>

  <script src="game.js?v=78-balance-system"></script>
</body>
</html>
